name: evame_connect
description: "EVAME — application mobile SAV (techniciens : interventions, suivi, statut)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management — Riverpod 3 (générateurs)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Réseau
  dio: ^5.9.1
  fpdart: ^1.2.0

  # Navigation
  go_router: ^17.0.1

  # Stockage local (jeton Sanctum + thème)
  shared_preferences: ^2.5.4

  # UI / utilitaires
  cached_network_image: ^3.4.1
  iconsax: ^0.0.8
  intl: ^0.20.2
  logger: ^2.6.2

  # Écran de lancement natif (image launch)
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Génération de code Riverpod
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.10.4

  # Icône de lancement de l'application
  flutter_launcher_icons: ^0.14.4

# --- Icône de l'application (logo EVAME centré avec marge) ---
flutter_launcher_icons:
  image_path: "assets/images/icon-evame.png"
  min_sdk_android: 21
  android: "launcher_icon"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon-evame.png"
  ios: true
  image_path_ios: "assets/images/icon-evame.png"
  remove_alpha_ios: true

# --- Écran de lancement (splash) : fond blanc, logo centré ---
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo-evame.png
  android_12:
    image: assets/images/logo-evame.png
    color: "#FFFFFF"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
